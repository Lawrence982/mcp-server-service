apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-inspector-http
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mcp-inspector
  template:
    metadata:
      labels:
        app: mcp-inspector
    spec:
      containers:
        - name: inspector-http
          image: ghcr.io/modelcontextprotocol/inspector:latest
          ports:
            - containerPort: 6274
            - containerPort: 6277
          env:
            - name: HOST
              value: 0.0.0.0
            - name: ALLOWED_ORIGINS
              value: http://{{ .Values.ingress.uiHost }}
