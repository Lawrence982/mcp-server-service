apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-inspector-ingress
spec:
  rules:
    - host: {{ .Values.ingress.uiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-http
                port:
                  number: {{ .Values.service.ui.port }}
    - host: {{ .Values.ingress.proxyHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-inspector-http
                port:
                  number: {{ .Values.service.proxy.port }}
