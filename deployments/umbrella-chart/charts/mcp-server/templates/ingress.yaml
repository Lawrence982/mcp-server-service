apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server-ingress
spec:
  rules:
    - host: mcp.server.local
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: mcp-server-service
                port:
                  number: {{ .Values.SERVICE.PORT }}