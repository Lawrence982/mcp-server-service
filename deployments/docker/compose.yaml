name: mcp-server-and-inspector

services:
  # -------- HTTP: Java MCP server -----------------------------
  mcp-server-http:
    build:
      context: ../../                   # корень: папка docker (где compose.yml и .dockerignore)
      dockerfile: deployments/docker/Dockerfile
      target: http
    image: mcp-server:http
    container_name: mcp-server-http
    environment:
      JAVA_TOOL_OPTIONS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:62925
    expose:
      - "8091"
    ports:
      - "8091:8091"
      - "62925:62925"
    networks:
      - proxynet


  #   -------- Inspector for the HTTP server (UI -> localhost:6274) ---------------------
  inspector-http:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector-http
    depends_on:
      - mcp-server-http
    environment:
      HOST: "0.0.0.0"
      ALLOWED_ORIGINS: "http://localhost:6274"
    ports:
      - "6274:6274"                # Inspector UI (http)
      - "6277:6277"                # Inspector proxy (http)
    networks:
      - proxynet

networks:
  proxynet:
    name: custom_network                               # Общая пользовательская сеть Docker